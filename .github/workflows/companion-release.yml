name: Publish and validate Companion integration
on:
  push:
    branches: [integration/monday-release]
    paths: ['delivery/**', 'companion/**', 'tools/assemble_companion.py', '.github/workflows/companion-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'Jodi1time/dojo-odoo19' && github.ref == 'refs/heads/integration/monday-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assemble source or restore explicitly reviewed missing manifests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d companion ]; then python tools/assemble_companion.py; fi
          if [ ! -f companion/package.json ] || [ ! -f companion/package-lock.json ]; then
            SOURCE="$(mktemp -d)"
            git -C "$SOURCE" init
            git -C "$SOURCE" fetch --depth=1 https://github.com/jDelille/companion.git c108399f38093c01f2e1f187e7feaa929a43eace
            git -C "$SOURCE" show FETCH_HEAD:package.json > companion/package.json
            git -C "$SOURCE" show FETCH_HEAD:package-lock.json > companion/package-lock.json
            python - <<'PY'
          import json,pathlib
          p=pathlib.Path('companion/package.json')
          data=json.loads(p.read_text())
          data['scripts']['test:odoo-integration']='bash tools/test-odoo-gateway.sh'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
            rm -rf "$SOURCE"
          fi
      - name: Publish candidate source without touching other branches
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -- companion
          git add -f -- companion/package.json companion/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='Jodi Ojeikhoa' -c user.email='162644954+Jodi1time@users.noreply.github.com' commit -m 'Track the reviewed Companion manifests and integration source'
            git push origin HEAD:refs/heads/integration/monday-release
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  frontend:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked dependencies
        working-directory: companion
        run: npm ci
      - name: Read bundled framework guidance
        working-directory: companion
        run: |
          mkdir -p ../frontend-evidence
          find node_modules/next/dist/docs -type f -iname '*route*' -o -iname '*cookies*' > ../frontend-evidence/framework-guidance-files.txt || true
      - name: Verify contract and gateway tests
        working-directory: companion
        shell: bash
        run: |
          set -euo pipefail
          npm run test:odoo-integration 2>&1 | tee ../frontend-evidence/gateway-tests.log
      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: companion
        run: npm run lint > ../frontend-evidence/lint.log 2>&1
      - name: Production build
        id: build
        working-directory: companion
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../frontend-evidence/build.log
      - name: Verify entire application types
        working-directory: companion
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee ../frontend-evidence/typecheck.log
      - name: Record exact source and lint gate
        if: always()
        run: |
          mkdir -p frontend-evidence
          printf 'source=%s\nlint=%s\nbuild=%s\n' '${{ needs.assemble.outputs.source }}' '${{ steps.lint.outcome }}' '${{ steps.build.outcome }}' > frontend-evidence/result.txt
          test '${{ steps.lint.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dojang-frontend-evidence-${{ needs.assemble.outputs.source }}
          path: frontend-evidence/
          retention-days: 7
